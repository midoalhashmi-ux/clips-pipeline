name: Clean temporary media

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  PAGES_PROJECT: clipmedia-9x4k
  BASE_URL: https://clipmedia-9x4k.pages.dev

jobs:
  clean:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Decide
        id: decide
        run: |
          EXP=$(curl -fsS "$BASE_URL/expires.txt" || true)
          echo "expires: ${EXP:-none}"
          if [ -z "$EXP" ]; then echo "clean=no" >> "$GITHUB_OUTPUT"; exit 0; fi
          if [ "$(date -u +%s)" -ge "$(date -u -d "$EXP" +%s)" ] || [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "clean=yes" >> "$GITHUB_OUTPUT"
          else
            echo "clean=no" >> "$GITHUB_OUTPUT"
          fi
      - name: Deploy an empty site
        if: steps.decide.outputs.clean == 'yes'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          mkdir empty && echo '<!doctype html><title>.</title>' > empty/index.html
          npx --yes wrangler@3 pages deploy empty --project-name "$PAGES_PROJECT" --branch main --commit-dirty=true
