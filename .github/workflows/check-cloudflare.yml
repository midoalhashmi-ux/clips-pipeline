name: Check Cloudflare access

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Test the Cloudflare token (silent, prints no project names)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID || 'bde373bccc926d9805939154b3d59a8b' }}
        run: |
          if npx --yes wrangler@3 pages project list > /dev/null 2>&1; then echo "CLOUDFLARE_OK"; else echo "CLOUDFLARE_FAILED"; exit 1; fi
