name: Check Cloudflare access

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Diagnose the Cloudflare token (prints only shape and the API verdict, never the value)
        env:
          T: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          echo "length=${#T}"
          if [[ "$T" =~ [[:space:]] ]]; then echo "has_whitespace=yes"; else echo "has_whitespace=no"; fi
          if [[ "$T" =~ ^[0-9a-fA-F]+$ ]]; then echo "all_hex=yes"; else echo "all_hex=no"; fi
          if [[ "$T" == Bearer* ]]; then echo "starts_with_Bearer=yes"; else echo "starts_with_Bearer=no"; fi
          R=$(curl -s -H "Authorization: Bearer ${T}" https://api.cloudflare.com/client/v4/user/tokens/verify || true)
          echo "$R" | python3 -c "import sys,json
try:
    d=json.load(sys.stdin)
    print('api_success=',d.get('success'))
    print('api_status=',(d.get('result') or {}).get('status'))
    print('api_errors=',[e.get('message') for e in d.get('errors',[])])
except Exception as e:
    print('api_unreadable')"
