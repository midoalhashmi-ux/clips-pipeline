name: Telegram inbox

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: telegram-inbox
  cancel-in-progress: false

jobs:
  poll:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Read new messages from the owner
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_OWNER_ID: ${{ secrets.TELEGRAM_OWNER_ID }}
        run: python3 tools/autoproduce/tg_inbox.py
      - name: Commit the inbox record (metadata only, no media)
        run: |
          if ! git diff --quiet tools/autoproduce/inbox.json; then
            git config user.name "inbox-bot"
            git config user.email "inbox-bot@users.noreply.github.com"
            git add tools/autoproduce/inbox.json
            git commit -q -m "Telegram inbox update"
            git pull --rebase -q origin main && git push -q origin HEAD:main
          fi
