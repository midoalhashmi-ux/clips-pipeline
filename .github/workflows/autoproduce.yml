name: Weekly content production

on:
  workflow_dispatch:
    inputs:
      days:
        description: 'Days ahead to produce'
        default: '7'
      only:
        description: 'Single queue key to produce (optional, overrides days)'
        default: ''

permissions:
  contents: write

jobs:
  produce:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install ffmpeg and yt-dlp
        run: |
          sudo timeout 300 apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 update -qq || true
          sudo timeout 600 apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 install -y -qq ffmpeg libraqm0 libfribidi0
          pip install yt-dlp pillow
      - name: SEO check (fails on any rule violation)
        run: python tools/autoproduce/seo_check.py
      - name: Free keyword research (YouTube and Google suggestions)
        continue-on-error: true
        run: python tools/autoproduce/keyword_research.py
      - uses: actions/upload-artifact@v4
        if: ${{ hashFiles('tools/autoproduce/keyword-research.json') != '' }}
        with:
          name: keyword-research
          path: tools/autoproduce/keyword-research.json
          retention-days: 12
      - name: Outro audio cache key
        id: outrokey
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import hashlib, json
          t = json.load(open('docs/marketing/publishing-policy.json'))['download_outros']
          print('h=' + hashlib.sha1(json.dumps(t, sort_keys=True).encode()).hexdigest()[:12])
          PY
      - name: Restore outro voice cache (saves the free voice quota)
        uses: actions/cache@v4
        with:
          path: tools/autoproduce/outro_cache
          key: outro-audio-${{ steps.outrokey.outputs.h }}-${{ github.run_id }}
          restore-keys: outro-audio-${{ steps.outrokey.outputs.h }}
      - name: Restore saved narration voices (scans branch)
        run: |
          mkdir -p tools/autoproduce/outro_cache
          if git fetch -q --depth=1 origin scans 2>/dev/null; then git archive FETCH_HEAD voices 2>/dev/null | tar -x -C tools/autoproduce/outro_cache --strip-components=1 || true; fi
          ls tools/autoproduce/outro_cache | head -50
      - name: Produce clips
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        run: python tools/autoproduce/produce.py --days "${{ inputs.days || '7' }}" --only "${{ inputs.only }}"
      - name: QA contact sheets of the finished videos (scans branch)
        if: ${{ !cancelled() && hashFiles('tools/autoproduce/out/**') != '' }}
        run: |
          mkdir -p qa_out
          for v in tools/autoproduce/out/*/video-youtube.mp4; do
            n=$(basename "$(dirname "$v")")
            ffmpeg -y -loglevel error -i "$v" -vf "fps=1,scale=-2:240,drawtext=fontfile=tools/autoproduce/fonts/Cairo-Variable.ttf:text='%{eif\:n\:d}':x=6:y=6:fontsize=26:fontcolor=yellow:box=1:boxcolor=black@0.6,tile=10x5" -frames:v 1 -q:v 5 "qa_out/$n.jpg" || true
          done
          git config user.name "qa-bot"
          git config user.email "qa-bot@users.noreply.github.com"
          if git fetch -q origin scans 2>/dev/null; then git worktree add -q ../qb origin/scans -B scans; else git worktree add -q --orphan -b scans ../qb; fi
          mkdir -p ../qb/qa && cp qa_out/*.jpg ../qb/qa/ 2>/dev/null || true
          mkdir -p ../qb/voices && cp tools/autoproduce/outro_cache/voice-*.wav ../qb/voices/ 2>/dev/null || true
          cd ../qb && git add -A && (git commit -q -m "QA sheets" && git pull -q --rebase origin scans && git push -q origin scans) || echo "nothing new"
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() && hashFiles('tools/autoproduce/out/**') != '' }}
        with:
          name: ready-clips
          path: tools/autoproduce/out/
          retention-days: 12
