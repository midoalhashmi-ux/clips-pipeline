name: Scan candidate clips

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: scans-branch
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install ffmpeg and yt-dlp
        run: |
          # ffmpeg جاهز من GitHub (أسرع وأثبت من خوادم الحزم)، والمكتبات العربية للنصوص اختيارية إن وُجدت
          curl -sSL --retry 3 -o /tmp/ff.tar.xz https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-linux64-gpl.tar.xz
          tar -xf /tmp/ff.tar.xz -C /tmp && sudo cp /tmp/ffmpeg-master-latest-linux64-gpl/bin/ff* /usr/local/bin/ && ffmpeg -version | head -1
          (sudo timeout 120 apt-get -o Acquire::Retries=2 -o Acquire::http::Timeout=20 update -qq && sudo timeout 180 apt-get install -y -qq --no-install-recommends libraqm0 libfribidi0) || echo "apt skipped"
          pip install -q yt-dlp pillow
          python -c "from PIL import features; assert features.check('raqm'), 'Arabic text shaping (raqm) missing'; print('raqm ok')"
      - name: Download candidates and build contact sheets
        run: python tools/autoproduce/scan_clips.py
      - name: Commit sheets to the scans branch (not main)
        run: |
          git config user.name "scan-bot"
          git config user.email "scan-bot@users.noreply.github.com"
          if git fetch -q origin scans 2>/dev/null; then
            git worktree add -q ../sb origin/scans -B scans
          else
            git worktree add -q --orphan -b scans ../sb
          fi
          mkdir -p ../sb/scans && cp scans_out/*.jpg scans_out/*.json ../sb/scans/ 2>/dev/null || true
          cd ../sb && git add -A && (git commit -q -m "Scan sheets" && git push -q origin scans) || echo "nothing new"
